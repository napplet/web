name: Standalone CLI

on:
  pull_request:
    paths:
      - 'packages/cli/**'
      - 'packages/boilerplate/**'
      - 'packages/conformance-cli/**'
      - 'pnpm-lock.yaml'
      - 'deno.*'
      - '.github/workflows/standalone-cli.yml'
  push:
    branches: [main]
    paths:
      - 'packages/cli/**'
      - 'packages/boilerplate/**'
      - 'packages/conformance-cli/**'
      - 'pnpm-lock.yaml'
      - 'deno.*'
      - '.github/workflows/standalone-cli.yml'

permissions:
  contents: read

concurrency:
  group: standalone-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: No host tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            asset: napplet-linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            asset: napplet-linux-aarch64
          - os: macos-latest
            target: darwin-aarch64
            asset: napplet-darwin-aarch64
          - os: macos-15-intel
            target: darwin-x86_64
            asset: napplet-darwin-x86_64
          - os: windows-latest
            target: windows-x86_64
            asset: napplet-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @napplet/conformance-cli... build
      - name: Pack the unpublished recording runner
        run: pnpm --dir packages/conformance-cli pack --pack-destination ../..
      - name: Compile release binary
        run: deno task --cwd packages/cli compile:${{ matrix.target }}
      - name: Exercise commands with empty PATH and a fresh cache
        run: deno test --node-modules-dir=none -A packages/cli/tests/standalone_integration_test.ts packages/cli/tests/recording_standalone_test.ts
        env:
          NAPPLET_TEST_STANDALONE: '1'
          NAPPLET_TEST_RECORDING_PACKAGE: napplet-conformance-cli-0.4.0.tgz
          NAPPLET_TEST_BINARY: packages/cli/dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: packages/cli/dist/${{ matrix.asset }}
          retention-days: 14
