name: Link check

# Builds one static artifact with the Astro showcase, preserved explainer, docs,
# conformance runtime and installers. Both workflows use scripts/assemble-site.mjs.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/docs/**'
      - 'apps/conformance/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'scripts/check-links.mjs'
      - 'scripts/check-showcase.mjs'
      - 'scripts/check-protocol.mjs'
      - 'scripts/check-protocol-browser.mjs'
      - 'scripts/generate-protocol*'
      - 'scripts/lib/protocol-data.mjs'
      - 'scripts/assemble-site.mjs'
      - 'scripts/assemble-site.test.mjs'
      - '.github/workflows/link-check.yml'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/docs/**'
      - 'apps/conformance/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'scripts/check-links.mjs'
      - 'scripts/check-showcase.mjs'
      - 'scripts/check-protocol.mjs'
      - 'scripts/check-protocol-browser.mjs'
      - 'scripts/generate-protocol*'
      - 'scripts/lib/protocol-data.mjs'
      - 'scripts/assemble-site.mjs'
      - 'scripts/assemble-site.test.mjs'
      - '.github/workflows/link-check.yml'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: denoland/setup-deno@v2

      - run: pnpm install --frozen-lockfile

      # Build workspace package deps the apps may import, then each app.
      - name: Build packages
        run: pnpm build

      - name: Build Astro showcase and explainer
        run: pnpm --filter @napplet/web build

      - name: Build docs (base /docs/)
        run: pnpm --filter @napplet/docs build

      - name: Build conformance runtime (base /conformance/)
        run: pnpm --filter @napplet/conformance-web build --base=/conformance/

      - name: Test site assembly
        run: node --test scripts/assemble-site.test.mjs

      - name: Assemble site
        run: node scripts/assemble-site.mjs

      - name: Verify every protocol route
        run: node scripts/check-protocol.mjs

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Serve site and check links
        run: |
          set -euo pipefail
          python3 -m http.server 8099 --directory site &
          SRV=$!
          trap 'kill "$SRV" 2>/dev/null || true' EXIT

          # Poll until the static server answers (bounded retries).
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:8099/; then
              echo "Server is up after ${i} attempt(s)"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Server did not start in time" >&2
              exit 1
            fi
            sleep 1
          done

          node scripts/check-links.mjs http://localhost:8099
          node scripts/check-showcase.mjs http://localhost:8099
          node scripts/check-protocol-browser.mjs http://localhost:8099
